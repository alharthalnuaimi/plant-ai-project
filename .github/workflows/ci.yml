name: CI

# Phase 4 — keep PRs honest:
#   * `tests` runs the full pytest suite against the in-memory backend so
#     it needs no Supabase / no YOLO weights / no network.
#   * `import-smoke` is a 2-step sanity check that catches accidental
#     top-level import regressions (missing module, syntax error in any
#     router, etc.) before the full suite has to run.
#
# Triggers: every PR + every push to main. Skips drafts via concurrency.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: pytest (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Force the in-memory persistence backend so the suite is hermetic
      # (no Supabase, no asyncpg pool). Mirrors backend/tests/conftest.py.
      PERSISTENCE_BACKEND: memory
      PERSIST_EVENTS: "false"
      YOLO_WEIGHTS_PATH: ""
      # Keep CORS at the legacy wide-open default — tests exercise that.
      CORS_ALLOWED_ORIGINS: "*"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

  import-smoke:
    name: import smoke (backend.main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PERSISTENCE_BACKEND: memory
      PERSIST_EVENTS: "false"
      YOLO_WEIGHTS_PATH: ""
      CORS_ALLOWED_ORIGINS: "*"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Import backend.main on Linux
        working-directory: backend
        run: |
          python -c "import main; print('OK — FastAPI app loaded:', main.app.title)"
