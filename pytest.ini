[pytest]
testpaths = backend/tests
pythonpath = backend
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -ra --tb=short --strict-markers
markers =
    smoke: lightweight integration that boots the FastAPI app
    unit:  fast pure-python tests with no IO
    db:    requires a running Postgres / Supabase
    gemini_live: calls the real Gemini API (opt-in: RUN_GEMINI_LIVE_TESTS=1 and GEMINI_API_KEY)
