; ────────────────────────────────────────────────────────────────
; Plant AI — ESP32 Sensor Node
; PlatformIO Project Configuration
; ────────────────────────────────────────────────────────────────

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor baud rate
monitor_speed = 115200

; Upload speed (increase if your USB adapter supports it)
upload_speed = 921600

; OTA upload target — comment out when flashing via USB,
; uncomment and set IP to flash over-the-air
; upload_protocol = espota
; upload_port     = 192.168.0.XXX   ; replace with your ESP32's IP
; upload_flags    = --auth=plantai123

; ── Libraries ──────────────────────────────────────────────────
; All managed by PlatformIO's library registry
lib_deps =
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  claws/BH1750 @ ^1.3.0
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
  bblanchon/ArduinoJson @ ^7.0.4

; ArduinoOTA and WiFi/HTTPClient are part of the ESP32 Arduino
; framework — no extra lib_deps entry needed.

; ── Build flags ────────────────────────────────────────────────
build_flags =
  -DCORE_DEBUG_LEVEL=1     ; 0=none 1=error 2=warn 3=info 4=debug 5=verbose

; ── Partition scheme ───────────────────────────────────────────
; "min_spiffs" gives more sketch space (good for OTA)
board_build.partitions = min_spiffs.csv
